<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Task Capabilities & Timelines</title>
  <style>
    /* 🎨 BRAND COLORS — CUSTOMIZE HERE 🎨 */
    :root {
      --color-primary: #2c3e50;        /* Main heading/accent color */
      --color-secondary: #3498db;      /* Buttons, links */
      --color-accent: #e74c3c;         /* Highlights */
      --color-bg: #ecf0f1;             /* Page background */
      --color-card-bg: #ffffff;        /* Card/table background */
      --color-text: #2c3e50;           /* Body text */
      --color-text-light: #7f8c8d;     /* Secondary text */
      --color-border: #bdc3c7;         /* Borders */
      --color-success: #27ae60;        /* For "Can Do" */
      --color-danger: #e74c3c;         /* For "Cannot Do" */
      
      /* 🔤 TYPOGRAPHY — CUSTOMIZE HERE 🔤 */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-heading: var(--font-family);
      --font-size-base: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--color-secondary);
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 2.5em;
      color: var(--color-primary);
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--color-text-light);
      font-size: 1.1em;
    }

    /* 🔍 SEARCH & FILTER CONTROLS 🔍 */
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-container {
      flex: 1;
      min-width: 250px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--color-border);
      border-radius: 6px;
      font-size: 1em;
      font-family: var(--font-family);
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 15px;
      border: 2px solid var(--color-secondary);
      background-color: transparent;
      color: var(--color-secondary);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      font-family: var(--font-family);
      transition: all 0.3s;
    }

    button:hover {
      background-color: var(--color-secondary);
      color: white;
    }

    button.active {
      background-color: var(--color-secondary);
      color: white;
    }

    /* 📊 SECTION TABS 📊 */
    .section-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--color-border);
    }

    .section-tab {
      padding: 12px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: var(--color-text-light);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .section-tab.active {
      color: var(--color-secondary);
      border-bottom-color: var(--color-secondary);
    }

    /* 📋 TABLE STYLING 📋 */
    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--color-card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    thead {
      background-color: var(--color-primary);
      color: white;
    }

    th {
      padding: 15px;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    th:hover {
      background-color: var(--color-secondary);
    }

    th.sortable::after {
      content: " ↕";
      opacity: 0.5;
      font-size: 0.8em;
    }

    th.sortable.asc::after {
      content: " ↑";
      opacity: 1;
    }

    th.sortable.desc::after {
      content: " ↓";
      opacity: 1;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid var(--color-border);
    }

    tbody tr:hover {
      background-color: rgba(52, 152, 219, 0.05);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .task-type {
      font-weight: 700;
      color: var(--color-primary);
      min-width: 150px;
    }

    .timeline {
      color: var(--color-secondary);
      font-weight: 600;
      white-space: nowrap;
    }

    .cannot-do .task-type {
      color: var(--color-danger);
    }

    .cannot-do .timeline {
      color: var(--color-danger);
    }

    /* 📱 RESPONSIVE 📱 */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      .controls {
        flex-direction: column;
      }

      .search-container {
        min-width: 100%;
      }

      table {
        font-size: 0.9em;
      }

      th, td {
        padding: 10px;
      }

      .section-tabs {
        flex-wrap: wrap;
      }
    }

    /* 📌 FOOTER 📌 */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 2px solid var(--color-border);
      text-align: center;
      color: var(--color-text-light);
      font-size: 0.9em;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--color-text-light);
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>👋 Design Capabilities</h1>
      <p class="subtitle">What we can do, estimated timelines, and what's out of scope</p>
    </header>

    <!-- SEARCH & FILTER -->
    <div class="controls">
      <div class="search-container">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by task type or description..."
          aria-label="Search design tasks"
        >
      </div>
      <div class="filter-buttons">
        <button id="sortTimelineBtn" class="sortable-btn">Sort by Timeline</button>
        <button id="resetBtn">Show All</button>
      </div>
    </div>

    <!-- SECTION TABS -->
    <div class="section-tabs">
      <button class="section-tab active" data-section="can-do">✅ Can Do</button>
      <button class="section-tab" data-section="cannot-do">❌ Cannot Do</button>
    </div>

    <!-- CAN DO SECTION -->
    <div id="can-do" class="content-section active">
      <table id="canDoTable">
        <thead>
          <tr>
            <th class="sortable">Design Type</th>
            <th>Description</th>
            <th class="sortable">Timeline</th>
          </tr>
        </thead>
        <tbody id="can-doBody"></tbody>
      </table>
      <div id="can-doNoResults" class="no-results" style="display: none;">No tasks match your search.</div>
    </div>

    <!-- CANNOT DO SECTION -->
    <div id="cannot-do" class="content-section cannot-do">
      <table id="cannotDoTable">
        <thead>
          <tr>
            <th class="sortable">Design Type</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="cannot-doBody"></tbody>
      </table>
      <div id="cannot-doNoResults" class="no-results" style="display: none;">No tasks match your search.</div>
    </div>

    <footer>
      <p>Last updated: August 8, 2025 | Easily update data in the HTML file's data section</p>
    </footer>
  </div>

  <!-- 📊 DATA — EASY TO UPDATE 📊 -->
  <script>
    // Data source
    const canDoData = [
      { type: "Book Layouts", description: "Designing interior layouts for printed books, with styled typography and images. Used for memoirs, guidebooks, portfolios, or self-published works.", timeline: "2–4 weeks", timelineSort: 28 },
      { type: "Digital Ads", description: "Creating web and social ads optimized for engagement, including Google display banners and Instagram story graphics for promotions or launches.", timeline: "3–7 days", timelineSort: 5 },
      { type: "E-Book Design", description: "Formatting e-books with styled text, interactive links, and covers. Prepared for platforms like Kindle or Amazon KDP, including print-ready or print-on-demand versions.", timeline: "1.5–3 weeks", timelineSort: 21 },
      { type: "Event Materials", description: "Designing print and digital materials like invitations, programs, and signage for conferences, fundraisers, or corporate events.", timeline: "1–2 weeks", timelineSort: 14 },
      { type: "Infographics", description: "Visualizing data or ideas through engaging charts, diagrams, or timelines. Ideal for reports, websites, social posts, or presentations.", timeline: "4–7 days", timelineSort: 5 },
      { type: "Logo & Branding", description: "Creating unique logos, visual identity elements, and brand guides for use across websites, social media, packaging, and marketing assets.", timeline: "1–3 weeks", timelineSort: 21 },
      { type: "Marketing Materials", description: "Designing promotional print and digital content such as flyers, business cards, posters, brochures, or direct mail pieces.", timeline: "1–2 weeks", timelineSort: 14 },
      { type: "Podcast Assets", description: "Developing podcast branding such as cover art, episode templates, audiograms, and social media graphics to promote new episodes.", timeline: "1–2 weeks", timelineSort: 14 },
      { type: "Presentations", description: "Designing Google Slides or Canva decks that align with your brand. Used for pitches, webinars, school projects, or proposals.", timeline: "4–7 days", timelineSort: 5 },
      { type: "Print Collateral", description: "Creating high-quality printed materials like brochures, catalogs, or newsletters for sharing key info at events or through mailers.", timeline: "1–2 weeks", timelineSort: 14 },
      { type: "Product Packaging", description: "Designing labels, boxes, inserts, or wraps for physical products. Often used for cosmetics, food, or merchandise.", timeline: "2–3 weeks", timelineSort: 21 },
      { type: "Resumes", description: "Designing clean, visually appealing resumes that highlight your experience, skills, and achievements. Used for internships, jobs, or scholarships.", timeline: "2–4 days", timelineSort: 3 },
      { type: "Signage", description: "Designing large-format visuals like banners, posters, or event backdrops to grab attention, guide attendees, or reinforce branding.", timeline: "1–2 weeks", timelineSort: 14 },
      { type: "Social Media Assets", description: "Creating branded graphics for posts, stories, and profile content across platforms like Instagram, TikTok, Facebook, and LinkedIn.", timeline: "4–7 days", timelineSort: 5 },
      { type: "Squarespace Website Build", description: "Designing and customizing Squarespace sites with styled pages and features. Ideal for portfolios, online shops, project hubs, blogs, and more.", timeline: "3–6 weeks", timelineSort: 42 },
      { type: "UI/UX Design", description: "Designing intuitive interfaces for apps or websites with user journeys, wireframes, and polished layouts for a smooth experience.", timeline: "5–7 weeks", timelineSort: 49 },
      { type: "Website Maintenance", description: "Making updates to keep sites fresh and functional, adding new content, fixing layout issues, or adjusting styles after launch.", timeline: "1–5 days", timelineSort: 3 },
    ];

    const cannotDoData = [
      { type: "3D Design", description: "We do not create 3D models, renders, or animations. These projects are time-intensive and require specialized tools. Students should connect with a 3D designer early if this is needed." },
      { type: "Animation or Motion Graphics", description: "We do not produce animations or motion graphics. This includes animated titles or advanced video editing. Students should seek out a motion designer if this is part of their vision." },
      { type: "Children's Books Requiring Illustrations", description: "We do not create original illustrations for books. We can assist with layout, suggest illustrators, or guide students who want to illustrate their work." },
      { type: "Coding for Apps", description: "We do not code mobile or web apps. Our team has basic knowledge of HTML, CSS, and limited JavaScript, but full development is out of scope." },
      { type: "Game or App Interface Design", description: "We do not design game or app interfaces, including HUDs (heads-up displays), which are the on-screen graphics in games that show health bars, scores, maps, or player stats." },
      { type: "Advanced Website Interactions", description: "We do not build complex web features such as custom tools, interactive dashboards, or advanced e-commerce systems." },
      { type: "Product Photography", description: "We do not offer photography services. We support photo editing and retouching, but image capture should be handled by a dedicated photographer." },
    ];

    let canDoTasks = JSON.parse(JSON.stringify(canDoData));
    let cannotDoTasks = JSON.parse(JSON.stringify(cannotDoData));
    let currentSort = null;
    let currentSection = 'can-do';

    function renderTable(section) {
      const tasks = section === 'can-do' ? canDoTasks : cannotDoTasks;
      const tableBody = document.getElementById(`${section}Body`);
      const noResults = document.getElementById(`${section}NoResults`);

      if (!tableBody) {
        console.error(`Table body not found for section: ${section}`);
        return;
      }

      tableBody.innerHTML = '';

      tasks.forEach(task => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="task-type">${task.type}</td>
          <td>${task.description}</td>
          ${section === 'can-do' ? `<td class="timeline">${task.timeline}</td>` : ''}
        `;
        tableBody.appendChild(row);
      });

      if (tableBody.children.length === 0 && noResults) {
        noResults.style.display = 'block';
      } else if (noResults) {
        noResults.style.display = 'none';
      }
    }

    function filterTasks(searchTerm) {
      const searchLower = searchTerm.toLowerCase();

      canDoTasks = canDoData.filter(task =>
        task.type.toLowerCase().includes(searchLower) ||
        task.description.toLowerCase().includes(searchLower)
      );

      cannotDoTasks = cannotDoData.filter(task =>
        task.type.toLowerCase().includes(searchLower) ||
        task.description.toLowerCase().includes(searchLower)
      );

      renderTable('can-do');
      renderTable('cannot-do');
    }

    function sortByTimeline() {
      if (currentSort === 'asc') {
        canDoTasks.sort((a, b) => b.timelineSort - a.timelineSort);
        currentSort = 'desc';
      } else {
        canDoTasks.sort((a, b) => a.timelineSort - b.timelineSort);
        currentSort = 'asc';
      }
      document.getElementById('sortTimelineBtn').classList.toggle('active');
      renderTable('can-do');
    }

    function resetView() {
      document.getElementById('searchInput').value = '';
      canDoTasks = JSON.parse(JSON.stringify(canDoData));
      cannotDoTasks = JSON.parse(JSON.stringify(cannotDoData));
      currentSort = null;
      document.getElementById('sortTimelineBtn').classList.remove('active');
      renderTable('can-do');
      renderTable('cannot-do');
    }

    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('searchInput').addEventListener('input', (e) => {
        filterTasks(e.target.value);
      });

      document.getElementById('sortTimelineBtn').addEventListener('click', sortByTimeline);
      document.getElementById('resetBtn').addEventListener('click', resetView);

      document.querySelectorAll('.section-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
          document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
          
          e.target.classList.add('active');
          const section = e.target.dataset.section;
          const sectionElement = document.getElementById(section);
          if (sectionElement) {
            sectionElement.classList.add('active');
            currentSection = section;
          }
        });
      });

      // Initial render
      renderTable('can-do');
      renderTable('cannot-do');
    });
  </script>
</body>
</html>
